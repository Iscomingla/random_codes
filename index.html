<!DOCTYPE html>
<html style="font-family: Arial, Helvetica, sans-serif;">
	<head>
		<meta charset="utf-8">
		<title>Random codes, to do random things</title>
		<style>
			.in-dev::before {
				content: "[IN DEV]";
				color: yellowgreen;
				padding-right: 10px;
			}
		</style>
	</head>
	<body style="color:white; background: #000000; background: linear-gradient(90deg,rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 1) 30%, rgba(0, 7, 199, 1) 50%, rgba(0, 0, 0, 1) 70%, rgba(0, 0, 0, 1) 100%); display: flex; flex-direction: column; align-items: center;">
		<h1>Random codes — useless but working</h1>
		<nav style="width: 60%;">
			<div style="background-color: rgb(0, 7, 199); display: flex; flex-direction: column; padding: 1rem 3rem; border-radius: 20px;">
				<h2 style="margin: 0;">chess.com profile</h2>
				<span class="in-dev">check public data of a <a href="https://chess.com" style="color: white;">chess.com</a> profile</span>
				<div><input id="chesscom" type="text" placeholder="enter player ID" style="margin-right: 5px; width: 45%;"><button onclick="location.href=`./chesscom/index.html?player=${document.getElementById('chesscom').value ?? 'chesscom'}`" style="width: 30%;">Check chess.com profile</button></div>
			</div>	
		</nav>
	</body>
</html>
